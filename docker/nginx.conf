server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Los paquetes recientes de nginx en Debian cambiaron el HTTP_HOST por
        # defecto de $http_host a $host (por CVE de confusión de Host header),
        # pero $host descarta el puerto — rompe url()/route() de Laravel en
        # cualquier despliegue detrás de un puerto no estándar (ej. pruebas
        # locales en :8091). Detrás del Nginx del VPS con proxy_set_header
        # Host $host, el header ya llega sin puerto, así que esto no cambia
        # nada en producción; solo restaura el comportamiento esperado.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Bloquea acceso directo a archivos ocultos (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
